# dsh-study-demo bundle patch —— 学习演示面板插件。
#
# package.json 声明了 dsh.bundle.patch（本文件），因此
# `dsh plugin --profile web add <本包路径>` 安装后会把它自动并入 profile 的
# bundle 层（dsh.profile.bundles），下面这条 insert 随 bundle 自动应用。
#
# 后续层（profile 自己的 cordis.patch.yml、--patch 覆盖）可按 id 覆写本行的 config：
# 调演示体积上限 → config.maxHtmlBytes（默认 800000，schema 见 lib/index.js）；
# 关掉插件 → disabled: true（loader 字段，不走 config）。例如：
#
#   - id: dsh-study-demo
#     config:
#       maxHtmlBytes: 2000000
#   - id: dsh-study-demo
#     disabled: true

- insert:
    - id: dsh-study-demo
      name: '@dsh-external/dsh-study-demo'
